name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lazarus/FPC
        # libgtk2.0-dev: the GUI links the gtk2 LCL widgetset (the .lpi
        # default); FPC's gtk2 bindings compile without it, but linking
        # needs -lgtk-x11-2.0/-lgdk-x11-2.0. Not pulled in automatically
        # with --no-install-recommends. Still available on 26.04, but
        # slated for removal from the archive, so keep an eye on it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lazarus fpc libgtk2.0-dev

      # ttg.lpi expects ZeosLib and multithreadprocs in sibling dirs of the
      # repo (../../zeoslib, ../../multithreadprocs relative to src/).
      - name: Check out dependencies
        run: |
          PARENT="$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 -b 8.0-patches \
            https://github.com/frones/ZeosLib.git "$PARENT/zeoslib"
          # The two local fixes (patches/zeoslib/) are not (yet) in the
          # cloned branch; apply them, skipping any that are already merged.
          cd "$PARENT/zeoslib"
          for p in "$GITHUB_WORKSPACE"/patches/zeoslib/*.patch; do
            if git apply --reverse --check "$p" 2>/dev/null; then
              echo "already applied: $(basename "$p")"
            else
              git apply "$p" && echo "applied: $(basename "$p")"
            fi
          done
          MT="$(dirname "$(find /usr/share/lazarus /usr/lib/lazarus \
            -name mtprocs.pas 2>/dev/null | head -1)")"
          test -n "$MT"
          ln -s "$MT" "$PARENT/multithreadprocs"
          for lpk in "$PARENT"/zeoslib/packages/lazarus/z*.lpk; do
            lazbuild --add-package-link "$lpk"
          done

      # SynEdit (required by ttg.lpi) ships with the distro Lazarus.
      - name: Build GUI (ttg) and headless (ttgsolve) binaries
        run: make

      - name: Run headless solver tests
        run: make test
